name: Karaz Platform
description: >-
  Karaz is an AI-driven Electronic Health Record (EHR) platform based in Saudi
  Arabia that connects healthcare practitioners, patients, insurance providers,
  and wellness vendors in a unified health-management ecosystem. It provides
  real-time biometric and continuous-glucose (CGM) monitoring, AI-driven
  treatment insights, patient and provider mobile apps, analytics and reporting,
  rewards and community engagement, and a health-vendor marketplace, with
  integrations across Apple, Abbott, Medtronic, Dexcom, Roche, Google, and Omron.
  The Karaz developer API (early-stage) exposes Karaz App and Karaz Care resources
  over HTTPS with Bearer-token authentication. Surfaced as a portfolio company of
  500 Global and enriched by the API Evangelist pipeline from public sources.
